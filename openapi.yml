openapi: '3.0.3'
info:
  title: AIMIE API
  description: The AI Moderation Intuitive Engine Service API is a RESTful API that provides a set of services for to perform legal content generation, moderation, and analysis.
  version: '0.5'
servers:
  - url: http://localhost:7071
  - url: https://service.example.invalid
paths:
  /api/AIInteractionService/qa:
    post:
      summary: Generate a question and answer pair
      description: Generate a question and answer pair based on the input text.
      operationId: generateQA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/GenerateQARequest'
      responses:
        '200':
          description: A question and answer pair generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The instance ID of the QA job.
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
    
  /api/AIInteractionService/declaration:
    post:
      summary: Generate a question and answer pair
      description: Generate a question and answer pair based on the input text.
      operationId: generateQA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/GenerateDeclarationRequest'
      responses:
        '200':
          description: A question and answer pair generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The instance ID of the QA job.
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
    
  /api/AIInteractionService/discovery:
    post:
      summary: Generate a question and answer pair
      description: Generate a question and answer pair based on the input text.
      operationId: generateQA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/GenerateDiscoveryRequest'
      responses:
        '200':
          description: A question and answer pair generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The instance ID of the QA job.
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.

  /api/AIInteractionService/status/{id}:
    get:
      summary: Get the status of a question and answer pair generation job
      description: Get the status of a question and answer pair generation job based on the instance ID.
      operationId: getQAStatus
      parameters:
        - name: id
          in: path
          required: true
          description: The instance ID of the QA job.
          schema:
            type: string
      responses:
        '200':
          description: The status of the QA job.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/StatusResult'
                  
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.

  /api/AIInteractionService/events/query:
    post:
      summary: Query event-tagged account records
      description: Uses an agent to answer a query from Azure Search records containing the event tag and every requested tag.
      operationId: queryEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventQueryRequest'
      responses:
        '200':
          description: A source-grounded, model-reviewed answer or a transparent partial candidate result when model review cannot be completed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EventQueryVerifiedResult'
                  - $ref: '#/components/schemas/EventQueryPartialResult'
        '400':
          description: Invalid request.
        '500':
          description: Event query failed.

  /api/AIInteractionService/evidence/search:
    post:
      summary: Search account records by query and tags
      description: Combines Azure AI Search keyword search (searchMode all), query vectors from the shared text embedding provider, and semantic ranking. Requires compatible vector dimensions and a semantic configuration (default Primary). Every supplied tag must match exactly, including case. Matches any supplied who value and any supplied where value; groups combine with AND. Date ranges match overlapping calendar periods independently for whenStarted and whenEnded, excluding records missing the requested date. An empty or omitted tags array searches by query alone; query '*' browses by filters. Text queries use embeddings without an answer-generating LLM or event tag restriction. Query * bypasses embeddings and semantic ranking. Tags, who, and where use vector prefiltering. Vector neighbors cover skip plus top (minimum 50, maximum 1000); date filters use 1000 neighbors and read every returned candidate page before counting and pagination. Counts describe retrieved candidates, not all conceptually relevant records. Semantic ranking reranks up to 50 candidates. Text searches return only candidates with a semantic reranker score of at least 1.8; missing scores are excluded. Score and date filters apply before counting and pagination within those 50 candidates. Query * bypasses the score cutoff. A 1.8 cutoff can still admit unrelated results.
      operationId: searchAccountRecords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSearchRequest'
      responses:
        '200':
          description: Ranked indexed records and the total match count before pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSearchResult'
        '400':
          description: Invalid JSON or request parameters.
        '404':
          description: Account or search index not found.
        '500':
          description: Account search failed.

  /api/AIInteractionService/evidence/search/values:
    get:
      summary: List unique tags, people, and locations in an account's search index
      description: Uses one Azure AI Search facet query for tags, who, and where with top 0 and count 0, returning all distinct sorted non-empty values without downloading documents. All three fields must be facetable. Indexed case is preserved. No LLM or embeddings are used. Use this endpoint to populate all search filter options.
      operationId: listAccountSearchValues
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Unique values, or empty arrays for an empty index.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, tags, who, where]
                properties:
                  accountId:
                    type: string
                  tags:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  who:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  where:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
        '400':
          description: Missing or invalid accountId.
        '404':
          description: Account or search index not found.
        '500':
          description: Search value listing failed.

components:
  schemas:
    AccountSearchRequest:
      type: object
      required: [accountId, query]
      properties:
        accountId:
          type: string
          minLength: 1
          description: Account whose configured search endpoint and dataSourceId index are queried.
        query:
          type: string
          minLength: 1
          description: Text for hybrid vector/keyword search with semantic ranking, or '*' to browse by filters without embeddings.
        tags:
          type: array
          default: []
          items:
            type: string
            minLength: 1
          description: Every tag must match. Outer whitespace is trimmed; case is preserved and duplicates are removed.
        who:
          type: array
          items:
            type: string
            minLength: 1
          description: Match any selected person exactly, including case. Empty or omitted means no restriction.
        where:
          type: array
          items:
            type: string
            minLength: 1
          description: Match any selected location exactly, including case. Empty or omitted means no restriction.
        whenStarted:
          $ref: '#/components/schemas/AccountSearchDateFilter'
        whenEnded:
          $ref: '#/components/schemas/AccountSearchDateFilter'
        top:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        skip:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0

    AccountSearchDateFilter:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Inclusive calendar range containing from and/or to. Accepts YYYY, YYYY-MM, or YYYY-MM-DD. Partial bounds expand to their full calendar period. Indexed year, month, quarter, and season periods match if they overlap this range; missing, invalid, and relative-year dates do not match. Each date field is evaluated independently. From must not be after to.
      properties:
        from:
          type: string
          pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
          example: '2024-01-01'
        to:
          type: string
          pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
          example: '2024-12-31'

    AccountSearchResult:
      type: object
      required: [accountId, query, tags, top, skip, totalCount, results]
      properties:
        accountId:
          type: string
        query:
          type: string
        tags:
          type: array
          items:
            type: string
        who:
          type: array
          items:
            type: string
        where:
          type: array
          items:
            type: string
        whenStarted:
          $ref: '#/components/schemas/AccountSearchDateFilter'
        whenEnded:
          $ref: '#/components/schemas/AccountSearchDateFilter'
        top:
          type: integer
        skip:
          type: integer
        totalCount:
          type: integer
          nullable: true
          description: Count before pagination. Text searches count the top 50 semantic candidates passing the 1.8 score cutoff and any date filters. Browse queries use an approximate Azure count without date filters or the exact observed date-filtered count. This is not a count of all conceptually relevant evidence.
        results:
          type: array
          items:
            type: object
            required: [tags, who, whenStarted, whenEnded, asOf, what, where, why, sourceId, source, pages]
            additionalProperties: false
            description: Only these eleven fields are returned; missing values are null.
            properties:
              tags:
                type: array
                nullable: true
                items:
                  type: string
              who:
                type: array
                nullable: true
                items:
                  type: string
              whenStarted:
                nullable: true
                oneOf:
                  - type: object
                    additionalProperties: true
                  - type: string
              whenEnded:
                nullable: true
                oneOf:
                  - type: object
                    additionalProperties: true
                  - type: string
              asOf:
                type: object
                nullable: true
                description: Structured date for a fact that is not an event, using the same date components as whenStarted. The entire field is null when unavailable.
                properties:
                  year:
                    type: string
                    nullable: true
                  month:
                    type: string
                    nullable: true
                  day:
                    type: string
                    nullable: true
                  season:
                    type: string
                    nullable: true
                  quarter:
                    type: string
                    nullable: true
              what:
                type: string
                nullable: true
              where:
                type: string
                nullable: true
              why:
                type: string
                nullable: true
              sourceId:
                type: string
                nullable: true
              source:
                type: string
                nullable: true
              pages:
                type: array
                nullable: true
                items:
                  type: integer

    EventQueryRequest:
      type: object
      required:
        - sessionId
        - accountId
        - tags
        - query
      properties:
        sessionId:
          type: string
          description: Correlation identifier used for logging and telemetry.
        accountId:
          type: string
          description: Account whose search index is queried.
        tags:
          type: array
          minItems: 1
          items:
            type: string
          description: Tags that every returned record must contain. The event tag is always enforced.
        query:
          type: string
          description: Question to answer from matching event records.
        maxDocCount:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20

    EventQueryResult:
      type: object
      required:
        - sessionId
        - accountId
        - tags
        - originalRequest
        - timeRange
        - entries
        - footnotes
      properties:
        sessionId:
          type: string
        accountId:
          type: string
        tags:
          type: array
          items:
            type: string
        originalRequest:
          type: string
        timeRange:
          type: object
          required:
            - startDate
            - endDate
          properties:
            startDate:
              type: string
              nullable: true
            endDate:
              type: string
              nullable: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EventQueryTimelineEntry'
        footnotes:
          type: array
          description: Source-grounded entries with neither a startDate nor an endDate.
          items:
            $ref: '#/components/schemas/EventQueryTimelineEntry'

    EventQueryVerifiedResult:
      allOf:
        - $ref: '#/components/schemas/EventQueryResult'
        - not:
            required:
              - code

    EventQueryPartialResult:
      description: Search candidates returned when retrieval succeeded but every model review variant failed. Entries, footnotes, and retrievedRecords are not model-verified answers.
      allOf:
        - $ref: '#/components/schemas/EventQueryResult'
        - type: object
          required:
            - code
            - message
            - retrievalStatus
            - reviewStatus
            - retrievedRecordCount
            - retrievedRecords
            - failureReasons
          properties:
            code:
              type: string
              enum:
                - EVENT_QUERY_PARTIAL_RESULT
            message:
              type: string
              description: Explains that the records are retrieval candidates and not model-verified.
            retrievalStatus:
              type: string
              enum:
                - succeeded
            reviewStatus:
              type: string
              enum:
                - incomplete
            retrievedRecordCount:
              type: integer
              minimum: 0
            retrievedRecords:
              type: array
              items:
                $ref: '#/components/schemas/EventQueryRetrievedRecord'
            failureReasons:
              type: array
              minItems: 1
              items:
                type: string
                enum:
                  - content_filter
                  - model_refusal
                  - invalid_structured_output
                  - timeout
                  - model_error
                  - no_model_variants

    EventQueryRetrievedRecord:
      type: object
      description: An allowlisted Azure AI Search record supplied as an unreviewed candidate in a partial result.
      required:
        - recordIndex
        - docId
        - sourceId
        - title
        - dateRange
      properties:
        recordIndex:
          type: integer
          minimum: 0
        docId:
          type: string
        sourceId:
          type: string
        title:
          type: string
        url:
          type: string
          nullable: true
        pages:
          type: array
          nullable: true
          items:
            oneOf:
              - type: integer
              - type: string
        tags:
          type: array
          items:
            type: string
        where:
          type: string
          nullable: true
        what:
          type: string
          nullable: true
        who:
          type: array
          items:
            type: string
        why:
          type: string
          nullable: true
        dateRange:
          type: object
          required:
            - startDate
            - endDate
          properties:
            startDate:
              type: string
              nullable: true
            endDate:
              type: string
              nullable: true
    EventQueryTimelineEntry:
      type: object
      required:
        - dateRange
        - eventType
        - summary
        - applicableSources
      properties:
        dateRange:
          type: object
          properties:
            startDate:
              type: string
              nullable: true
            endDate:
              type: string
              nullable: true
        eventType:
          type: string
          description: Human-readable, space-separated event label; never snake_case or camelCase.
        summary:
          type: string
        applicableSources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventQuerySource'

    EventQuerySource:
      type: object
      required:
        - docId
        - sourceId
      properties:
        docId:
          type: string
        sourceId:
          type: string
        url:
          type: string
          nullable: true
        pages:
          type: array
          nullable: true
          items:
            oneOf:
              - type: integer
              - type: string

    GenerateQARequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The session ID.
        accountId:
          type: string
          description: The account ID.
        question:
          type: string
          description: The question.
        maxDocCount:
          type: integer
          description: The maximum number of documents to search.
        location:
          type: string
          description: The geographic location of where the court proceeding is to occur.
        hearingType:
          type: string
          description: The type of court hearing (e.g. 'Family Low', Real Estate, ..etc.).
        indexPostfix:
            type: string
            description: The index postfix for the data source.
      required:
        - sessionId
        - accountId
        - question
        - maxDocCount
        - location
        - hearingType
    
    GenerateDeclarationRequest:
      allOf: 
      - $ref: "#/components/schemas/GenerateQARequest"
      - type: object
        properties:
          target:
            type: string
            description: The target of the question (e.g. 'Defendant', 'Plaintiff', 'Respondent', 'Petitioner', noun, ..etc.).
    
    GenerateDiscoveryRequest:
      allOf: 
      - $ref: "#/components/schemas/GenerateDeclarationRequest"
      - type: object
        properties:
          topics:
            type: array
            items:
              type: string
              description: The list of topics to discover.
          
    CustomStatus:
      type: object
      properties:
        actionsCompleted:
          type: integer
          description: The number of actions completed.
        actionsRemaining:
          type: integer
          description: The number of actions remaining.
        actionsToComplete:
          type: array
          items:
            type: string
            description: The list of actions completed.

    StatusResult:
      type: object
      properties:
        runtimeStatus: 
          $ref: '#/components/schemas/RuntimeStatus'
        customStatus:
          $ref: '#/components/schemas/CustomStatus'
        output:
          oneOf:
            - $ref: '#/components/schemas/QAOutput'
            - $ref: '#/components/schemas/DeclarationOutput'
            - $ref: '#/components/schemas/DiscoveryOutput'

    QAOutput:
      type: object
      properties:
        answer:
          type: string
          description: The answer to the question.
        chatHistory:
          type: array
          items:
            $ref: '#/components/schemas/ChatHistory'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        context:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSource'

    ChatHistory:
      type: object
      properties:
        id:
          type: string
          description: The ID of the chat message.
        content:
          type: string
          description: The content of the chat message.
        type:
          type: string
          description: The type of the source (e.g. `human`, `ai`).
        name:
          type: string
          description: The name of the source.
        example:
          type: boolean
          description: The example flag.
      required:
        - content
        - type
        - name
    
    DocumentSource:
      type: object
      properties:
        docId:
          type: string
          description: The ID of the source.
        pageContent:
          type: string
          description: The content of the page in markdown.
        source_url:
          type: string
          description: The URL of the source.
        source_id:
          type: string
          description: The ID of the source.
        position:
          type: integer
          description: The position of the source.
        title:
          type: string
          description: The title of the source.
        headers:
          type: array
          items:
            type: string
          description: The list of headers.
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the source.
        where:
          type: string
          nullable: true
          description: Fact event location, if applicable.
        what:
          type: string
          nullable: true
          description: Fact event description, if applicable.
        who:
          type: array
          items:
            type: string
          description: Fact event participants, if applicable.
        why:
          type: string
          nullable: true
          description: Fact event reason or supporting explanation, if applicable.
        whenStarted:
          type: object
          nullable: true
          additionalProperties: true
          description: Fact event start date, if applicable.
        whenEnded:
          type: object
          nullable: true
          additionalProperties: true
          description: Fact event end date, if applicable.
    
    Metadata:
      type: object
      properties:
        id:
          type: string
          description: The ID of the metadata.
        Header 1:
          type: string
          description: Optional header 1.
        Header 2:
          type: string
          description: Optional header 2.
        Header 3:
          type: string
          description: Optional header 3.
        Header 4:
          type: string
          description: Optional header 4.
        Header 5:
          type: string
          description: Optional header 5.
        Header 6:
          type: string
          description: Optional header 6.
        title:
          type: string
          description: The title of the source.
        source:
          type: string
          description: The source of the metadata.
        answers:
          type: string
          description: Optional answers.
        pages:
          type: array
          items:
            type: integer
            description: The pages associated with the metadata.
        sourceId:
          type: string
          description: Optional source ID.
        pos:
          type: integer
          description: Optional position.
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the metadata.
        where:
          type: string
          nullable: true
          description: Fact event location, if applicable.
        what:
          type: string
          nullable: true
          description: Fact event description, if applicable.
        who:
          type: array
          items:
            type: string
          description: Fact event participants, if applicable.
        why:
          type: string
          nullable: true
          description: Fact event reason or supporting explanation, if applicable.
        whenStarted:
          type: object
          nullable: true
          additionalProperties: true
          description: Fact event start date, if applicable.
        whenEnded:
          type: object
          nullable: true
          additionalProperties: true
          description: Fact event end date, if applicable.
      required:
        - title
        - source
        - pages
        - id
        - sourceId
    
    Citation:
      type: object
      properties:
        docId:
          type: string
          description: The document ID.
        pages:
          type: array
          items:
            type: integer
            description: The pages associated with the citation.
      required:
        - docId

    DeclarationOutput:
      type: object
      properties:
        accountId:
          type: string
          description: The account ID.
        sessionId:
          type: string
          description: The session ID.
        initialInquiry:
          $ref: '#/components/schemas/AnswerWithCitations'
        crossExamination:
          $ref: '#/components/schemas/AnswerWithCitations'
        closingStatement:
          $ref: '#/components/schemas/AnswerWithCitations'
        decisionStatement:
          $ref: '#/components/schemas/AnswerWithCitations'
        rhetoricalStatement:
          $ref: '#/components/schemas/AnswerWithCitations'
        finalDeclaration:
          type: string
          description: The final declaration text.
        exhibits:
          $ref: '#/components/schemas/PotentialExhibits'
        context:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSource'
        directSources:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
      required:
        - accountId
        - sessionId
        - initialInquiry
        - crossExamination
        - closingStatement
        - decisionStatement
        - rhetoricalStatement
        - finalDeclaration
        - exhibits
        - context
        - directSources

    AnswerWithCitations:
      type: object
      properties:
        answer:
          type: string
          description: The answer text.
        applicableSources:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          description: The citations applicable to the answer.
      required:
        - answer
        - applicableSources
    
    PotentialExhibits:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/SectionExhibits'

    SectionExhibits:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ExhibitQuotes'

    ExhibitQuotes:
      type: object
      properties:
        hasError:
          type: boolean
          description: Indicates if there is an error.
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/ExhibitQuote'
          description: The list of exhibit quotes.
      required:
        - hasError
        - quotes

    ExhibitQuote:
      type: object
      properties:
        docId:
          type: string
          description: The document ID.
        documentWithHighlightedQuote:
          type: string
          description: The document with the highlighted quote.
        exactQuote:
          type: string
          description: The exact quote.
      required:
        - docId
        - documentWithHighlightedQuote
        - exactQuote

    DiscoveryOutput:
      type: object
      properties:
        answer:
          type: string
          description: The answer text.
        questionsByTopic:
          type: array
          items:
            $ref: '#/components/schemas/QuestionByTopic'
        hasError:
          type: boolean
          description: Indicates if there is an error.
    
    QuestionByTopic:
      type: object
      properties:
        topic:
          type: string
          description: The topic.
        questions:
          type: array
          items:
            type: string
            description: The list of questions.
        source:
          $ref: '#/components/schemas/DiscoverySources'
      required:
        - topic
        - questions
    
    DiscoverySources:
      type: object
      properties:
        answer:
          type: string
          description: The answer text.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          description: The citations applicable to the answer.
      required:
        - answer
        - applicableSources

    RuntimeStatus:
      type: string
      enum:
        - Pending
        - Running
        - Completed
        - ContinuedAsNew
        - Failed
        - Terminated
        - Suspended
      description: The runtime status of the orchestration.
